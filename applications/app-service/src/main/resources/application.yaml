server:
  port: 8080
spring:
  application:
    name: "autenticacion"
  devtools:
    add-properties: false
  profiles:
    include: null
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/crediya_auth}
    username: ${DB_USERNAME:crediya}
    password: ${DB_PASSWORD:crediya}
    driverClassName: com.mysql.cj.jdbc.Driver
  jpa:
      databasePlatform: org.hibernate.dialect.MySQLDialect
